[project]
name = "reviewpilot-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"alembic/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: end-to-end pipeline tests (webhook to dashboard, mocked GitHub/Gemini)",
    "live: hits the real Gemini API; opt-in via REVIEWPILOT_E2E_LIVE=1",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
